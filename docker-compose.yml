services:
  postgres:
    image: postgres:16
    container_name: manualcall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manualcall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manualcall"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: manualcall-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_USER: ${SITE_USER}
      SITE_PASSWORD: ${SITE_PASSWORD}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/manualcall
      OMDB_API_KEY: ${OMDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      MWPROXY_BASE_URL: ${MWPROXY_BASE_URL}
      MWPROXY_TOKEN: ${MWPROXY_TOKEN}
      LEADS_API_KEY: ${LEADS_API_KEY}
      WORKER_SECRET: ${WORKER_SECRET}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads

  app-dev:
    build: .
    container_name: manualcall-app-dev
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_USER: ${SITE_USER}
      SITE_PASSWORD: ${SITE_PASSWORD}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/manualcall
      OMDB_API_KEY: ${OMDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      MWPROXY_BASE_URL: ${MWPROXY_BASE_URL}
      MWPROXY_TOKEN: ${MWPROXY_TOKEN}
      LEADS_API_KEY: ${LEADS_API_KEY}
      WORKER_SECRET: ${WORKER_SECRET}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- -H 0.0.0.0 -p 3000

  worker:
    build: ./worker
    container_name: manualcall-worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      NEXT_BASE: http://app:3000
      WORKER_SECRET: ${WORKER_SECRET}
      WORKER_EMPRESA: ${WORKER_EMPRESA:-}
      UPLOADS_DIR: /app/uploads/facturas
      POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-15}
      # Reinicia el navegador cada N facturas (evita el cascadeo si Finnegans cuelga).
      WORKER_RESTART_EVERY: ${WORKER_RESTART_EVERY:-5}
      FINNEGANS_USER: ${FINNEGANS_USER}
      FINNEGANS_PASS: ${FINNEGANS_PASS}
      FINNEGANS_WORKSPACE: ${FINNEGANS_WORKSPACE:-MULTIMEDIOS}
      HEADLESS: "true"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
