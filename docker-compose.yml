services:
  postgres:
    image: postgres:16
    container_name: manualcall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manualcall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manualcall"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: manualcall-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_USER: ${SITE_USER}
      SITE_PASSWORD: ${SITE_PASSWORD}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/manualcall
    ports:
      - "3000:3000"

volumes:
  pgdata:
