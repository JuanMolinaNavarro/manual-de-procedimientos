services:
  postgres:
    image: postgres:16
    container_name: manualcall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manualcall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manualcall"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: manualcall-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_USER: ${SITE_USER}
      SITE_PASSWORD: ${SITE_PASSWORD}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/manualcall
      OMDB_API_KEY: ${OMDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      MWPROXY_BASE_URL: ${MWPROXY_BASE_URL}
      MWPROXY_TOKEN: ${MWPROXY_TOKEN}
    ports:
      - "3000:3000"

  app-dev:
    build: .
    container_name: manualcall-app-dev
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_USER: ${SITE_USER}
      SITE_PASSWORD: ${SITE_PASSWORD}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/manualcall
      OMDB_API_KEY: ${OMDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      MWPROXY_BASE_URL: ${MWPROXY_BASE_URL}
      MWPROXY_TOKEN: ${MWPROXY_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- -H 0.0.0.0 -p 3000

volumes:
  pgdata:
