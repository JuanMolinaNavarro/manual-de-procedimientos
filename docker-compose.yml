# Variables del app compartidas por `app` y `app-dev` (se definen en el .env de al lado).
x-app-env: &app-env
  SITE_USER: ${SITE_USER}
  SITE_PASSWORD: ${SITE_PASSWORD}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/manualcall
  OMDB_API_KEY: ${OMDB_API_KEY:-}
  FANART_API_KEY: ${FANART_API_KEY:-}
  MWPROXY_BASE_URL: ${MWPROXY_BASE_URL:-}
  MWPROXY_TOKEN: ${MWPROXY_TOKEN:-}
  LEADS_API_KEY: ${LEADS_API_KEY:-}
  ISPBOSS_API_KEY: ${ISPBOSS_API_KEY:-}
  ISPBOSS_BASE_URL: ${ISPBOSS_BASE_URL:-https://viaccc.ispboss.com}
  # Recibos de Finnegans (API Teamplace)
  TEAMPLACE_CLIENT_ID: ${TEAMPLACE_CLIENT_ID:-}
  TEAMPLACE_CLIENT_SECRET: ${TEAMPLACE_CLIENT_SECRET:-}
  FINNEGANS_RECIBO_XML: ${FINNEGANS_RECIBO_XML:-}
  FINNEGANS_RECIBO_DATASOURCE: ${FINNEGANS_RECIBO_DATASOURCE:-}
  FINNEGANS_TOPE_MENSUAL: ${FINNEGANS_TOPE_MENSUAL:-}
  # Aviso por mail de recibos (sin SMTP_HOST = modo prueba: guarda .eml y no envía)
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  APP_URL: ${APP_URL:-}
  # Crons (sync de relojes, pipeline, deportes): en producción corren salvo CRON_ENABLED=0; en dev solo con CRON_ENABLED=1.
  CRON_ENABLED: ${CRON_ENABLED:-}
  # Solo para un deploy con cambios destructivos del schema ya revisados (ver docker/entrypoint.sh).
  PRISMA_ACCEPT_DATA_LOSS: ${PRISMA_ACCEPT_DATA_LOSS:-}

services:
  postgres:
    image: postgres:16
    container_name: manualcall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Solo se usa al crear el volumen por primera vez; cambiarla después NO cambia la de la base.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: manualcall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manualcall"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: manualcall-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads

  app-dev:
    build: .
    container_name: manualcall-app-dev
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- -H 0.0.0.0 -p 3000

volumes:
  pgdata:
  uploads_data:
